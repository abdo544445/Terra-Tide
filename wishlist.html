<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Terra & Tide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Terra & Tide</a>
        <button class="menu-toggle" aria-label="Toggle Menu">☰</button>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search products...">
            <button id="search-btn">🔍</button>
        </div>
        <nav>
            <ul>
                <li><a href="collections.html">Collections</a></li>
                <li><a href="about.html">Our Story</a></li>
                <li id="nav-auth"><a href="login.html">Login</a></li>
                <li><a href="wishlist.html">❤️</a></li>
                <li>
                    <a href="cart.html" class="cart-icon">
                        🛒
                        <span id="cart-count">0</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <div id="toast" class="toast"></div>

    <div class="container">
        <h2 class="section-title">My Wishlist</h2>
        <div id="wishlist-container" class="product-grid">
            <!-- Wishlist items loaded dynamically -->
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Terra & Tide. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadWishlist();
        });

        function loadWishlist() {
            const wishlist = JSON.parse(localStorage.getItem('terraWishlist') || '[]');
            const container = document.getElementById('wishlist-container');

            if (wishlist.length === 0) {
                container.innerHTML = '<p class="text-center">Your wishlist is empty.</p>';
                return;
            }

            wishlist.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                // Escape arguments for addToCart/removeFromWishlist
                const safeName = item.name.replace(/'/g, "\\'");
                const safeImage = item.image.replace(/'/g, "\\'");

                card.innerHTML = `
                    <img src="${item.image}" alt="${item.name}">
                    <div class="card-body">
                        <h3 class="card-title">${item.name}</h3>
                        <div class="card-price">$${item.price.toFixed(2)}</div>
                        <button class="btn-add-cart" onclick="removeFromWishlist('${item.id}')" style="background-color: #e74c3c;">Remove</button>
                         <button class="btn-add-cart mt-2" onclick="addToCart('${item.id}', '${safeName}', ${item.price}, '${safeImage}')">Add to Cart</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function removeFromWishlist(id) {
            let wishlist = JSON.parse(localStorage.getItem('terraWishlist') || '[]');
            wishlist = wishlist.filter(item => item.id !== id);
            localStorage.setItem('terraWishlist', JSON.stringify(wishlist));
            loadWishlist();
            showToast('Removed from wishlist');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collections - Terra & Tide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="index.html" class="logo">Terra & Tide</a>
            <button class="menu-toggle" aria-label="Toggle Menu">☰</button>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search products...">
            <button id="search-btn">🔍</button>
        </div>
        <nav>
            <ul>
                <li><a href="collections.html">Collections</a></li>
                <li><a href="about.html">Our Story</a></li>
                <li id="nav-auth"><a href="login.html">Login</a></li>
                <li><a href="wishlist.html">❤️</a></li>
                <li>
                    <a href="cart.html" class="cart-icon">
                        🛒
                        <span id="cart-count">0</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <div id="toast" class="toast"></div>

    <div class="container">
        <h2 class="section-title">Shop by Category</h2>
        <div class="collections-grid">
            <a href="living.html" class="collection-card">
                <img src="images/cat-living.png" alt="Living Room Collection">
                <div class="collection-overlay">
                    <h3 class="collection-title">Living</h3>
                    <p>Hand-woven rugs, cushions, and lighting.</p>
                </div>
            </a>
            <a href="kitchen.html" class="collection-card">
                <img src="images/cat-kitchen.png" alt="Kitchen Collection">
                <div class="collection-overlay">
                    <h3 class="collection-title">Kitchen</h3>
                    <p>Sustainable utensils, bowls, and storage.</p>
                </div>
            </a>
            <a href="wellness.html" class="collection-card">
                <img src="images/cat-wellness.png" alt="Wellness Collection">
                <div class="collection-overlay">
                    <h3 class="collection-title">Wellness</h3>
                    <p>Organic oils, candles, and self-care.</p>
                </div>
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Terra & Tide. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Terra & Tide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="index.html" class="logo">Terra & Tide</a>
            <button class="menu-toggle" aria-label="Toggle Menu">☰</button>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search products...">
            <button id="search-btn">🔍</button>
        </div>
        <nav>
            <ul>
                <li><a href="collections.html">Collections</a></li>
                <li><a href="about.html">Our Story</a></li>
                <li id="nav-auth"><a href="login.html">Login</a></li>
                <li><a href="wishlist.html">❤️</a></li>
                <li>
                    <a href="cart.html" class="cart-icon">
                        🛒
                        <span id="cart-count">0</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2 class="section-title">Join Us</h2>
        <form class="auth-form" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-submit">Sign Up</button>
            <p class="mt-2 text-center">Already have an account? <a href="login.html">Login</a></p>
        </form>
    </div>

    <footer>
        <p>&copy; 2024 Terra & Tide. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        function handleSignup(e) {
            e.preventDefault();
            const username = e.target.username.value;
            const email = e.target.email.value;
            const password = e.target.password.value;
            // signup function is defined in script.js
            if (signup(username, email, password)) {
                window.location.href = 'index.html';
            } else {
                alert('Invalid details! Username > 3 chars, Password > 6 chars, Email must contain "@".');
            }
        }
    </script>
</body>
</html>

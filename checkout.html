<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Terra & Tide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Terra & Tide</a>
        <button class="menu-toggle" aria-label="Toggle Menu">☰</button>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search products...">
            <button id="search-btn">🔍</button>
        </div>
        <nav>
            <ul>
                <li><a href="collections.html">Collections</a></li>
                <li><a href="about.html">Our Story</a></li>
                <li id="nav-auth"><a href="login.html">Login</a></li>
                <li><a href="wishlist.html">❤️</a></li>
                <li>
                    <a href="cart.html" class="cart-icon">
                        🛒
                        <span id="cart-count">0</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <div id="toast" class="toast"></div>

    <div class="container">
        <h2 class="section-title">Checkout</h2>
        <div class="checkout-grid">
            <div class="checkout-form">
                <h3>Shipping Information</h3>
                <form id="checkout-form" onsubmit="handleCheckout(event)">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address" required>
                    </div>
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city" required>
                    </div>
                    <div class="form-group">
                        <label for="zip">Zip Code</label>
                        <input type="text" id="zip" name="zip" required>
                    </div>
                    <div class="form-group">
                        <label for="cardNumber">Card Number (Mock)</label>
                        <input type="text" id="cardNumber" name="cardNumber" placeholder="0000 0000 0000 0000" required>
                    </div>
                    <button type="submit" class="btn-submit">Place Order</button>
                </form>
            </div>
            <div class="order-summary">
                <h3>Order Summary</h3>
                <div id="checkout-items"></div>
                <div id="checkout-total" class="cart-total">Total: $0.00</div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Terra & Tide. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderCheckoutSummary();
        });

        function renderCheckoutSummary() {
            const cart = getCart();
            const container = document.getElementById('checkout-items');
            const totalEl = document.getElementById('checkout-total');

            if (!container) return;

            container.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                const div = document.createElement('div');
                div.className = 'summary-item';
                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span>${item.name} (x${item.quantity})</span>
                        <span>$${itemTotal.toFixed(2)}</span>
                    </div>
                `;
                container.appendChild(div);
            });

            totalEl.textContent = `Total: $${total.toFixed(2)}`;
        }

        function handleCheckout(e) {
            e.preventDefault();
            const form = e.target;
            const orderData = {
                id: 'ORD-' + Date.now(),
                date: new Date().toLocaleDateString(),
                total: parseFloat(document.getElementById('checkout-total').textContent.replace('Total: $', '')),
                items: getCart(),
                shipping: {
                    name: form.fullName.value,
                    address: form.address.value,
                    city: form.city.value
                }
            };

            let orders = JSON.parse(localStorage.getItem('terraOrders') || '[]');
            orders.unshift(orderData);
            localStorage.setItem('terraOrders', JSON.stringify(orders));

            // Clear Cart
            localStorage.setItem('terraCart', JSON.stringify([]));
            updateCartCount();

            alert('Order Placed Successfully! Redirecting to Profile...');
            window.location.href = 'profile.html';
        }
    </script>
</body>
</html>
